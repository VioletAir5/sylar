name: Core build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install core dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libboost-context-dev libfmt-dev libyaml-cpp-dev \
            libssl-dev libsqlite3-dev libgtest-dev openssl python3
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DSYLAR_WITH_REDIS=OFF -DSYLAR_WITH_MYSQL=OFF
          -DSYLAR_WITH_ZOOKEEPER=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2
