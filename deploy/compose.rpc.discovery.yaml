# Overlay: docker compose -f deploy/compose.rpc.yaml -f deploy/compose.rpc.discovery.yaml up --build
services:
  registry:
    image: zookeeper:3.9
    environment:
      ZOO_TICK_TIME: "500"
    networks: [rpc]
    stop_grace_period: 5s
  catalog-a:
    build:
      args:
        SYLAR_WITH_ZOOKEEPER: "ON"
    environment:
      SYLAR_ZK_HOSTS: registry:2181
      SYLAR_ADVERTISE_HOST: catalog-a
    depends_on: [registry]
  catalog-b:
    environment:
      SYLAR_ZK_HOSTS: registry:2181
      SYLAR_ADVERTISE_HOST: catalog-b
    depends_on: [registry]
  gateway:
    environment:
      SYLAR_ZK_HOSTS: registry:2181
    depends_on: [registry, catalog-a, catalog-b]
