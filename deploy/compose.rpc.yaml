services:
  catalog-a:
    build:
      context: ..
      dockerfile: Dockerfile.rpc
    image: sylar-rpc:local
    command: ["catalog_server", "50051", "catalog-a", "0"]
    environment:
      SYLAR_LISTEN_ADDRESS: 0.0.0.0
    networks: [rpc]
    stop_grace_period: 5s
  catalog-b:
    image: sylar-rpc:local
    command: ["catalog_server", "50051", "catalog-b", "0"]
    environment:
      SYLAR_LISTEN_ADDRESS: 0.0.0.0
    networks: [rpc]
    stop_grace_period: 5s
  gateway:
    image: sylar-rpc:local
    command: ["rpc_gateway", "8080", "catalog-a:50051,catalog-b:50051"]
    depends_on: [catalog-a, catalog-b]
    environment:
      SYLAR_LISTEN_ADDRESS: 0.0.0.0
      SYLAR_RPC_TIMEOUT_MS: "500"
      SYLAR_RPC_MAX_INFLIGHT: "64"
    ports: ["18080:8080"]
    networks: [rpc]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 2s
      retries: 3
    stop_grace_period: 5s
networks:
  rpc:
    internal: true
